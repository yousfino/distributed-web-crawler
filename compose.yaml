services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${RESEARCH_DATABASE_PASSWORD:?Set RESEARCH_DATABASE_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - research-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  research-data:
